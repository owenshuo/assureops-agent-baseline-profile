[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "assureops-agent-baseline-profile"
version = "0.1.0"
description = "Evidence-backed Agent Baseline profile for governed quality agents."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "Apache-2.0" }
authors = [{ name = "owenshuo" }]
dependencies = ["pyyaml>=6.0,<7"]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.8,<1",
]

[project.scripts]
agent-baseline-profile = "agent_baseline_profile.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_baseline_profile"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
